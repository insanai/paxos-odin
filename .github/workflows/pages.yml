name: Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'python/paxodin/**', 'src/**', 'tools/build_site.py', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/**', 'python/paxodin/**', 'tools/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-odin
      - uses: typst-community/setup-typst@v5.2.0
        with:
          typst-version: "0.15.1"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          enable-cache: true
      - name: Build book, PODs, PDFs and API reference
        run: |
          make docs
          make python-docs
          python3 tools/build_site.py
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: website-preview
          path: _site
          retention-days: 7
      - uses: actions/configure-pages@v6.0.0
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
