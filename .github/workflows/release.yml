name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      full: true
  artifacts:
    name: CLI and wheel · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x86_64}
          - {runner: windows-latest, target: windows-x86_64}
          - {runner: macos-15, target: macos-arm64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-odin
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.14"
          enable-cache: true
      - name: Verify version and build CLI and standalone wheel
        run: |
          uv run --no-project python tools/release.py version
          uv run --no-project python tools/release.py cli --target=${{ matrix.target }}
          uv run --no-project python tools/release.py wheel
      - name: Repair Linux wheel with verified manylinux tags
        if: runner.os == 'Linux'
        run: |
          uvx --with patchelf --from auditwheel auditwheel repair release-dist/*.whl --wheel-dir repaired
          rm release-dist/*.whl
          mv repaired/*.whl release-dist/
      - name: Smoke installed wheel on every supported Python
        run: uv run --no-project python tools/release.py smoke
      - name: Native platform tests
        working-directory: python/paxodin
        run: |
          uv sync --locked
          uv run --no-sync pytest -q
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [verify, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-dist
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
      - name: Validate publication set and checksum artifacts
        run: |
          python3 tools/release.py version
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('release-dist').iterdir())
          assert len([p for p in files if p.suffix == '.whl']) == 3
          assert len(files) == 7, files
          PY
          python3 tools/release.py checksums
      - name: Publish tested Python distributions
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_KEY }}
        run: |
          test -n "$UV_PUBLISH_TOKEN" || { echo 'PYPI_API_KEY is not available. Hint: grant this repository access to the organization secret.'; exit 1; }
          mkdir -p pypi-dist
          cp release-dist/*.whl "release-dist/paxodin-${GITHUB_REF_NAME#v}.tar.gz" pypi-dist/
          uv publish --check-url https://pypi.org/simple/ pypi-dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.txt" <<'NOTES'
          Paxos-Odin launches as an Odin and Python monorepo.

          - Odin package: `paxos`; toolchain CLI: `paxodin`.
          - CLI archives: Linux x86-64, Windows x86-64, macOS Apple Silicon.
          - Python: `uv add paxodin`, with platform wheels for CPython 3.12–3.14.
          - [Book, design records and PDF downloads](https://insanai.github.io/paxos-odin/).
          - Archives include the MIT license; SHA256SUMS verifies release assets.

          Authored by Vikrant Rathore, with assistance from Ronak Rathore.
          Copyright 2026 Vikrant Rathore and Ronak Rathore. MIT licensed.
          NOTES
          gh release create "$GITHUB_REF_NAME" release-dist/* \
            --verify-tag --title "Paxos-Odin $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.txt"
